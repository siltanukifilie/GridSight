name: GridSight checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Python 3.14.4 has an official build for 24.04, not the newer latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GRIDSIGHT_LOW_MEMORY: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-web.txt pytest==9.2.0
      - run: python -m pytest -q
      - run: node --test tests/*.test.cjs
      - run: gunicorn --config gunicorn.conf.py --check-config 'app:create_app()'
